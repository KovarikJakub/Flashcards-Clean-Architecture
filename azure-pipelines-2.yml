trigger:
- master

variables:
  buildConfiguration: 'Release'
  dotNetFramework: 'net9.0'
  dotNetVersion: '9.0.x'
  targetRuntime: 'win-x64'

pool:
  vmImage: 'windows-latest'

steps:
  - template: CI_CD/build-WEB.yml

  - task: DotNetCoreCLI@2
    displayName: 'Publish Web App'
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: '**/Flashcards.Web.App.csproj'
      arguments: '--configuration $(buildConfiguration) --framework $(dotNetFramework) --output $(Build.ArtifactStagingDirectory)/web'
      modifyOutputPath: false

  - task: ArchiveFiles@2
    displayName: 'Create Site Zip'
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/web'
      includeRootFolder: false 
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/site.zip'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/site.zip'
      ArtifactName: 'WEB'
      publishLocation: 'Container'